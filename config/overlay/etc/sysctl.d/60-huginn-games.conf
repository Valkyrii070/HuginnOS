# Settings SteamOS also makes for games.
# A game that does a "split lock" (an atomic operation across two cache lines; some Windows games do) is slowed down
# on purpose by the kernel to warn about it, which can halve their frame rate. Not on a desktop that plays games.
-kernel.split_lock_mitigate = 0
# Memory compaction in the background moves pages around while a game runs, which shows as stutter; the kernel still
# compacts when it has to.
vm.compaction_proactiveness = 0
