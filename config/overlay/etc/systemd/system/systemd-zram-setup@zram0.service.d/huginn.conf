# With swap in RAM (cheap to reach), the kernel should swap to it readily and one page at a time, instead of
# dropping files' cache; set only once zram is there (with a swap on a disk these would be wrong).
[Service]
ExecStartPost=/usr/sbin/sysctl -q -w vm.swappiness=180 vm.watermark_boost_factor=0 vm.watermark_scale_factor=125 vm.page-cluster=0
