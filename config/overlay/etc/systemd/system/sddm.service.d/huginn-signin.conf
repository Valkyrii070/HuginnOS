# On a system that was installed with SDDM and has since been updated: Huginn's own sign-in service has the screen,
# and SDDM stands aside. It starts only if that service has failed (huginn-signin-fallback makes this file's flag),
# so nobody is left without a way in. Going back to an earlier version removes this file, and SDDM is as it was.
[Unit]
ConditionPathExists=/run/huginn-signin.failed
