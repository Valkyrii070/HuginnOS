# Compressed memory (zram): a swap in RAM, compressed with zstd (about 3 to 1), so when memory runs short the least
# used pages are packed tighter instead of written to the disk or the computer slowing to a crawl. It uses memory
# only as it fills. Huginn OS makes no swap on the disk, so this is the only swap.
[zram0]
zram-size = min(ram, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
