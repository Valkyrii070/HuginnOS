# Huginn's sign-in service (huginn-signind). Files in signin.conf.d/ are read after this one, in name order.
#
# [Autologin]
# User=astrid          who signs in by itself when the computer starts (Settings › Users writes 20-autologin.conf)
# Session=huginn       huginn (the desktop) or game (Game Mode)
# Relogin=false        true: signs straight back in after signing out (the installation drive)
