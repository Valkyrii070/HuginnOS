# Huginn OS's desktop portal: which backend answers which question for apps.
#   huginn           Open and Save, screenshots and colour picking, "Allow …?" questions, Open With, keeping the
#                    screen on or the computer awake, starting at sign-in (apps/huginn_portal.py, huginn_portal_more.py)
#   huginn-settings  dark or light, accent colour, contrast, motion, fonts (apps/huginn_portal_settings.py),
#                    with GTK's portal after it for anything Huginn has no say in
#   wlr              screen sharing and recording (PipeWire), from Huginn's compositor
#   gtk              what's left: printing, email, your name and picture, web apps added to the start menu
[preferred]
default=huginn;gtk
org.freedesktop.impl.portal.FileChooser=huginn
org.freedesktop.impl.portal.Screenshot=huginn
org.freedesktop.impl.portal.Access=huginn
org.freedesktop.impl.portal.AppChooser=huginn
org.freedesktop.impl.portal.Inhibit=huginn
org.freedesktop.impl.portal.Background=huginn
org.freedesktop.impl.portal.Settings=huginn-settings;gtk
org.freedesktop.impl.portal.ScreenCast=wlr
